<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steam Badge Trader</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="hero">
  <div class="who"><img id="avatar" alt=""><div><h1 id="name">Chargement…</h1><div class="sub" id="sub"></div></div></div>
  <div class="level"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="track"/><circle id="ring" cx="60" cy="60" r="52" class="ring"/></svg><div class="lv"><small>NIVEAU</small><b id="lvl">–</b></div></div>
  <div class="goal"><div class="kpi"><span id="proj">–</span><small>niveau atteignable</small></div><div class="kpi"><span id="gain">–</span><small>XP à gagner</small></div><div class="kpi"><span id="tot">–</span><small>coût total</small></div></div>
</header>
<main>
  <div class="bar"><h2>Sets à compléter <small>du moins cher au plus cher</small></h2>
    <div class="tools"><input id="q" placeholder="Rechercher un jeu…"><button id="refresh" class="ghost">↻ Actualiser</button><a class="ghost" href="https://www.steamcardexchange.net/" target="_blank" rel="noopener">SteamCardExchange ↗</a></div></div>
  <div id="load" class="load" hidden><div class="spin"></div><span id="loadt">Analyse de ton inventaire…</span></div>
  <div id="err" class="errbox" hidden></div>
  <section id="grid" class="grid"></section>
</main>
<dialog id="dlg"><form method="dialog"><button class="x" aria-label="Fermer">✕</button></form>
  <h3 id="dt"></h3>
  <label class="lab">Lien d'échange du partenaire <input id="turl" placeholder="https://steamcommunity.com/tradeoffer/new/?partner=…&token=…"></label>
  <button id="prev" class="ghost wide">Rechercher les cartes disponibles</button>
  <div id="pv" class="pv" hidden><div><h4>Tu reçois</h4><div id="askl" class="mini"></div></div><div class="arrow">⇄</div><div><h4>Tu donnes</h4><div id="givel" class="mini"></div></div></div>
  <p id="note" class="note"></p>
  <div id="guard" hidden><input id="gcode" placeholder="Code Steam Guard"><button id="gok" class="ghost">Valider</button></div>
  <button id="go" class="go" disabled>🚀 Lancer l'échange</button>
</dialog>
<div id="toast"></div>
<script src="app.js"></script></body></html>
